name: "Deploy"

# Deploys only from master: the OIDC trust policy on the AWS roles is
# scoped to this branch, so other triggers would fail at assume-role.
on:
  push:
    branches: ["master"]

permissions:
  id-token: write
  contents: read

jobs:
  site:
    uses: fhb4061/profile-manager-stacks/.github/workflows/static-site.yml@master
    with:
      build-cmd: npm run build
      dist-dir: dist
      aws-region: ap-southeast-2
    secrets: inherit
