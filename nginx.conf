# nginx config for the Profile Manager SPA.
#
# This file is installed as /etc/nginx/templates/default.conf.template, so the
# nginx image's entrypoint (20-envsubst-on-templates.sh) runs envsubst over it at
# CONTAINER START and writes /etc/nginx/conf.d/default.conf. That lets the CSP
# origins be set per-deployment without rebuilding the image.
#
# Substitution is restricted to ^CSP_ (NGINX_ENVSUBST_FILTER in the Dockerfile),
# so nginx's own runtime variables ($uri, $host, ...) are left untouched.
#
# Any CSP_* var left unset expands to an empty string, which degrades to a safe
# 'self'-only policy rather than a permissive one.

server {
    # nginxinc/nginx-unprivileged runs as a non-root user and so cannot bind :80.
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Don't advertise the nginx version.
    server_tokens off;

    # --- Security headers -------------------------------------------------
    # NOTE: add_header is only inherited by a location that defines no
    # add_header of its own. The locations below deliberately use `expires`
    # (a different directive) instead of add_header so these still apply.

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Deny every powerful feature; the app needs none of them. Photo upload uses
    # a plain file input, which requires no camera permission.
    add_header Permissions-Policy "accelerometer=(), ambient-light-sensor=(), autoplay=(), battery=(), camera=(), display-capture=(), document-domain=(), encrypted-media=(), fullscreen=(), gamepad=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), usb=(), xr-spatial-tracking=()" always;

    # Content-Security-Policy.
    #   connect-src  oidc-client-ts fetches OIDC discovery + JWKS from the issuer
    #                origin and the token endpoint from the Hosted UI domain; the
    #                app calls the API; photo upload POSTs straight to S3.
    #   frame-src    automaticSilentRenew renews in a hidden iframe pointing at
    #                the Hosted UI /oauth2/authorize, which then redirects the
    #                iframe back to our own /silent-renew -- hence 'self' too.
    #   img-src      blob: for URL.createObjectURL previews in EditProfile,
    #                data: for inlined icons, plus the photo CDN/bucket origin.
    #   style-src    no 'unsafe-inline': Tailwind v4 compiles to a static
    #                stylesheet and React sets inline styles via CSSOM, which CSP
    #                does not police. Verified against the built bundle.
    #   frame-ancestors replaces X-Frame-Options (superset, and CSP wins).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: ${CSP_MEDIA_ORIGIN}; font-src 'self'; connect-src 'self' ${CSP_API_ORIGIN} ${CSP_COGNITO_ORIGIN} ${CSP_COGNITO_HOSTED_UI_ORIGIN} ${CSP_MEDIA_ORIGIN}; frame-src 'self' ${CSP_COGNITO_ORIGIN} ${CSP_COGNITO_HOSTED_UI_ORIGIN}; form-action 'self' ${CSP_COGNITO_HOSTED_UI_ORIGIN}; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

    # --- Compression ------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml font/woff2;

    # --- Routing ----------------------------------------------------------

    # Content-hashed build output: safe to cache hard.
    location /assets/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # SPA history fallback. Without this, a refresh or deep link to /profiles or
    # /profile/:id hits nginx as a real path, finds no file and 404s.
    # index.html itself must never be cached, or clients pin a stale bundle hash.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
